<!doctype html>
<html lang="en" translate="no" class="notranslate">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="google" content="notranslate" />
    <title>Pi Web</title>
    <meta name="description" content="Pi Web interface for the pi coding agent" />
    <meta name="application-name" content="Pi Web" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" sizes="180x180" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Pi Web" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1a1a1a" />
    <script>
      // The theme is applied before the first paint so a stored dark preference does not flash a light page. It is the
      // same script the workbench exports, inlined because it has to run before the module graph loads.
      (function(){var t="auto";try{var s=localStorage.getItem("pi-theme");if(["light","dark","mist","rose","pine","auto"].includes(s))t=s}catch(e){}if(t==="auto")t=window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";var r=document.documentElement;r.dataset.theme=t;r.classList.toggle("dark",t==="dark"||t==="pine")})();
    </script>
  </head>
  <body translate="no" class="notranslate">
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
