<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hepi Workbench</title><style>:root{font:14px/1.45 system-ui,sans-serif;color:#17212b;background:#f4f6f7}*{box-sizing:border-box}body{margin:0}header{height:52px;display:flex;align-items:center;gap:12px;padding:0 18px;background:#17212b;color:white}header strong{font-size:15px}header input{width:min(280px,40vw)}main{display:grid;grid-template-columns:260px minmax(0,1fr);height:calc(100vh - 52px)}aside{overflow:auto;border-right:1px solid #cbd2d8;background:white;padding:10px}section{min-width:0;display:flex;flex-direction:column}nav{height:42px;display:flex;align-items:center;gap:6px;padding:0 12px;border-bottom:1px solid #cbd2d8;background:#fff}button,input{font:inherit}button{border:1px solid #b7c0c8;background:#fff;color:#17212b;border-radius:4px;padding:5px 10px;cursor:pointer}button[aria-pressed=true]{background:#dce9e5;border-color:#3b7665}.file{display:block;width:100%;text-align:left;border:0;padding:5px;background:transparent}.file:hover{background:#edf2f3}pre{flex:1;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;margin:0;padding:16px;background:#fbfcfc;font:13px/1.5 ui-monospace,monospace}.status{padding:6px 12px;color:#53616b;border-bottom:1px solid #d7dde1;font-size:12px}@media(max-width:650px){main{grid-template-columns:150px minmax(0,1fr)}aside{padding:6px}header{padding:0 10px}}</style></head><body><header><strong>Workbench</strong><input id="token" aria-label="Server token" placeholder="Server token" type="password"><select id="workspace" aria-label="Workspace"></select><button id="connect" title="Connect to the configured gateway workspace">Connect</button></header><main><aside id="files"></aside><section><nav><button data-view="preview" aria-pressed="true">File</button><button data-view="changes">Changes</button><button data-view="diff">Diff</button></nav><div class="status" id="status">Disconnected</div><pre id="content">No workspace selected</pre></section></main><script src="/workbench.js" defer></script></body></html>
