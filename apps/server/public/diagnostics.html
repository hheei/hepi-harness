<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Server diagnostics</title>
<style>body{font:16px system-ui;max-width:960px;margin:24px auto;padding:0 16px;background:#111827;color:#e5e7eb}header,nav,form{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}input,select,textarea,button{font:inherit;padding:10px;background:#1f2937;color:inherit;border:1px solid #4b5563;border-radius:6px}textarea{flex:1;min-width:240px}button{cursor:pointer}article{white-space:pre-wrap;overflow-wrap:anywhere;padding:16px;margin:12px 0;background:#1f2937;border-radius:8px}article[data-role=user]{border-left:3px solid #60a5fa}article[data-role=assistant]{border-left:3px solid #34d399}a{color:#93c5fd}#status{min-height:24px}</style>
<h1>Server diagnostics</h1><header><input id="token" type="password" placeholder="Server token" autocomplete="off"><button id="connect">Connect</button><a href="/workbench">Workbench</a></header>
<nav><select id="conversations" aria-label="Conversation"></select><button id="create">New conversation</button><button id="disconnect">Disconnect</button><button id="abort">Stop</button></nav>
<p id="status" role="status">Enter the server token to connect.</p><main id="messages" aria-live="polite"></main><form id="composer"><textarea id="text" aria-label="Message" placeholder="Message" required></textarea><button>Send</button></form><script type="module" src="/diagnostics.js"></script></html>
