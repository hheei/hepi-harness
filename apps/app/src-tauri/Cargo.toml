[package]
name = "hepi-app"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false
description = "Hepi App: the Tauri shell around the shared workbench"
license = "UNLICENSED"

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The OS credential store ticket 04 measured: Secret Service on this target, the platform store elsewhere.
keyring = "4.2.0"
sha2 = "0.10.9"
tauri-plugin-dialog = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = "symbols"
